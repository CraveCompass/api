services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: crave_admin
      POSTGRES_PASSWORD: crave_password
      POSTGRES_DB: cravecompass_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: